[project]
name = "lumendb-backend"
version = "0.1.0"
description = "LumenDB - AI-native database workspace backend (FastAPI + fastmcp)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "fastmcp>=2.10.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "sqlparse>=0.5.0",
    "cryptography>=43.0.0",
    "psycopg[binary]>=3.2.0",
    "pymysql>=1.1.0",
    "orjson>=3.10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]

[project.scripts]
lumendb = "app.main:run"

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# Explicit rule set so checks are reproducible regardless of any global ruff config.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF", "FURB"]
ignore = [
    "B008",    # FastAPI Depends() in defaults is idiomatic
    "RUF001",  # full-width punctuation is intentional in Chinese prompts / UI copy
    "RUF002",
    "RUF003",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
